# Toan bo he thong chay trong Docker. Mot dich vu, mot o dia.
#
# SQLite + WAL, mot tien trinh ghi duy nhat (lich chay nen trong chinh app)
# nen khong can Postgres. Them dich vu thu hai chi de tach lich chay se dem
# lai tranh chap ghi ma khong doi lai gi.
#
# Chot ten du an: thu muc da doi tu live/ sang trading-bot/. Ten volume duoc
# ghim rieng o cuoi tep (live2_livedata) nen doi ten du an khong lam mat so.
name: live
services:
  app:
    build: .
    image: crypto-live:latest
    container_name: crypto-live
    restart: unless-stopped
    # CHI lang nghe tren loopback cua may that. Trang nay khong co dang nhap
    # va dieu khien duoc tien that -- khong bao gio mo ra ngoai.
    ports:
      - "127.0.0.1:8777:8000"
    environment:
      DB_PATH: /data/live.db
      # ---- cong tac chay that, lop khoa thu nhat ----
      # De 0 thi bo dat lenh BI VO HIEU HOA O TANG MA, nut bam trong UI cung
      # khong bat duoc. Phai doi thanh 1 VA bat cong tac trong UI moi dat lenh.
      LIVE_TRADING_ENABLED: "1"
      BINANCE_API_KEY: "${BINANCE_API_KEY:?dat BINANCE_API_KEY trong .env}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:?dat BINANCE_API_SECRET trong .env}"
 
      # testnet | live  -- doi sang live la doi ca endpoint lan tien that
      BINANCE_ENV: "${BINANCE_ENV:-live}"
      # ============ DUNG CHUNG CHO CA HAI CHIEN LUOC ============
      # ---- tran rui ro, ap o tang ma truoc khi gui lenh ----
      # Tong danh nghia MO THEM moi luot. 1500 chu khong 500: voi stop HVN
      # mot lenh RSI(2) co the toi 500 USD, hai tin hieu cung ngay se chan nhau.
      MAX_GROSS_USD: "${MAX_GROSS_USD:-1500}"
      # 500 chu khong 150: stop HVN (RSI2_STOP_HVN=1) co khi chi cach 2% gia,
      # o 1R × 8 = 16 USD lenh toi ~800 USD. Lenh RSI(2) vuot tran duoc THU
      # NHO ve dung tran (rui ro < 1R, ghi «thu về trần» trong ly do) chu khong
      # bi bo. O 500: ~4,5% lenh RSI(2) bi thu nho; o 150 la 21%.
      MAX_ORDER_USD: "${MAX_ORDER_USD:-500}"
      MAX_ORDERS_PER_RUN: "${MAX_ORDERS_PER_RUN:-40}"
      # ---- ky quy: app tu dua moi ma ve CHEO + don bay nay truoc khi vao lenh ----
      # Ma ket isolated (dang co vi the) duoc nap them toi khi don bay thuc <= muc nay.
      LEVERAGE: "${LEVERAGE:-5}"
      # ---- cach dat lenh: limit (maker 0,02%/luot) | market (taker 0,05%/luot) ----
      # limit = LIMIT GTX o gia tot nhat cung phia, moi vong cho LIMIT_WAIT_S
      # giay roi huy + dat lai o gia moi, toi da LIMIT_ROUNDS vong (~2 phut).
      # Con thieu sau het vong: lenh DONG luon chuyen sang thi truong (khong de
      # ket vi the); lenh MO chuyen sang thi truong neu LIMIT_FALLBACK=1, de 0
      # thi bo phan chua khop (co the lo dung nhung lenh gia chay nhanh nhat).
      ORDER_MODE: "${ORDER_MODE:-limit}"
      LIMIT_ROUNDS: "${LIMIT_ROUNDS:-5}"
      LIMIT_WAIT_S: "${LIMIT_WAIT_S:-20}"
      LIMIT_FALLBACK: "${LIMIT_FALLBACK:-1}"
      # Tran TONG phoi nhiem, tinh ca vi the dang mo: boi so von (2 = 2x von).
      MAX_GROSS_X: "${MAX_GROSS_X:-2}"
      # Dung an toan dat THAT tren san (STOP_MARKET): RSI(2) o muc cat lo,
      # dong luong o SAFETY_R x R tu gia vao (3R ~ 3 sigma qua 7 ngay giu).
      SAFETY_R: "${SAFETY_R:-3}"
      # ---- don vi rui ro: 1R = so USD mat khi cham diem cat lo ----
      # Co lenh = RISK_R_USD / R, nen no KHONG phu thuoc von. Von chi quyet
      # dinh mo duoc bao nhieu lenh cung luc (RISK_MAX_OPEN).
      # Quy tac: phoi nhiem ~300x 1R, nen co von V thi 1R ~ V/300.
      #
      # Bo so duoi day dat cho TAI KHOAN TEST 500 USD:
      #   1R = 2  -> co lenh trung vi 13,9 USD, nho nhat 1,48 USD
      #              5,7% vi the roi duoi muc toi thieu 5 USD cua san
      #              phoi nhiem trung vi 354 USD, dinh 896 USD = 1,79x don bay
      #   Ha xuong 1R = 1 thi het don bay nhung 24,5% lenh bi san tu choi.
      RISK_R_USD: "${RISK_R_USD:-2}"
      # 7 so lech ngay x (2 mua + 2 ban) = 28, cong 5 cho cua RSI(2) = 33.
      # Tran nay DUNG CHUNG: de 28 thi dong luong day so la RSI(2) het cho.
      RISK_MAX_OPEN: "${RISK_MAX_OPEN:-33}"
      # ---- bat/tat tung chien luoc: he so nhan cho 1R, 0 = TAT ----
      # Tat thi vi the dang mo cua chien luoc do bi DONG o luot ke tiep.
      # RSI(2) = 8: o cung 1R, RSI(2) gan nhu vang mat khoi danh muc. Do bang
      # tab «Tinh lich su» (1R = 100, khong tran): 1 → 8 lai +12%, sut khong
      # doi; tu ~16 tro len sut bat dau tang. Xem docs/money-management-r.md
      # § Ghep hai chien luoc, muc SUA — so 32 cu dem trung lenh RSI(2).
      ALLOC_RSI2: "${ALLOC_RSI2:-8.0}"        # chi RSI(2)
      ALLOC_XSMOM: "${ALLOC_XSMOM:-1.0}"      # chi dong luong cat ngang
      # ---- RSI(2) mua them: so lop toi da moi ma (1 = khong mua them, 1..5) ----
      # Dang giu ma ma RSI(2) lai < 10 thi mo them mot lop, moi lop 1R va mot
      # cho rieng. Bang chung yeu (26 lenh lop 2, chua ngoai mau) — xem
      # docs/rsi2-connors.md § Mua them. Muon tat: dat 1.
      RSI2_LAYERS: "${RSI2_LAYERS:-3}"
      # ---- RSI(2) cat lo o dinh khoi luong (HVN) gan nhat duoi gia ----
      # 1 = bat: moi tin hieu tai 20 ngay nen 1H, dung volume profile, stop =
      # HVN gan nhat − 0,25×ATR (tran 40% giu nguyen). Khong co HVN / loi mang
      # → 6×ATR nhu cu. 0 = tat. Bang chung: dat luat nghien cuu nhung phan lon
      # la co lenh to hon; Sharpe chenh KTC chua 0 — docs/stop-dinh-day.md.
      # Tab «Tinh lich su» mo phong y nhu vay (bang bars1h, gieo tu /seed1h).
      # Chot loi da thu 22 kieu, khong kieu nao hon thoat RSI > 70 — giu nguyen.
      RSI2_STOP_HVN: "${RSI2_STOP_HVN:-1}"
      # ---- tin huy niem yet: chan lenh MUA moi ----
      # Ma co thong bao "Binance Will Delist" (spot) hoac "Binance Futures Will
      # Delist" (perp) trong N ngay gan nhat: RSI(2) khong mo lop moi, dong
      # luong khong mo chan mua. Vi the dang giu va chan ban khong doi. Moi
      # luot chay doc 2 trang thong bao moi nhat. 0 = tat. docs/huy-niem-yet.md
      DELIST_BAN_DAYS: "${DELIST_BAN_DAYS:-90}"
      START_EQUITY_USD: "${START_EQUITY_USD:-500}"
      # chay hang ngay luc 00:05 UTC, ngay sau khi nen 1D dong
      RUN_AT_UTC: "${RUN_AT_UTC:-00:05}"
      #
      # ============ THAM SO RIENG TUNG CHIEN LUOC ============
      # KHONG dat qua bien moi truong. Chung duoc chot trong app/config.py
      # (RSI2 = 14 o, XSMOM = 8 o) va sua luc chay qua tab «Cau hinh»:
      #   RSI(2)     : rsi2.topn slots rsi_in rsi_out ma atr atr_k cap min_bars
      #                vp_days vp_bin vp_buf (volume profile cho stop HVN)
      #                (rieng rsi2.layers / stop_hvn co bien RSI2_LAYERS / RSI2_STOP_HVN o tren)
      #   Dong luong : xsmom.topn lookback frac legs sleeves hold min_bars ma
      # Ly do: hai bo nay duoc chon kem ke toan da phep thu (49 o cat ngang,
      # nguong Sidak 0,00105). Doi chung la ket qua that khong con duoc bao
      # chung boi nghien cuu, nen phai di qua UI — noi co bang canh bao lech
      # va ghi nhat ky — chu khong lang le qua bien moi truong.
    volumes:
      - livedata:/data
      # Mo cache nghien cuu CHI DOC de gieo mam lan dau cho nhanh.
      # Bo dong nay thi lan chay dau se tu tai tu Binance (lau hon nhieu).
      - ../reports/.cache/uni1d:/seed:ro
      # Nen 1H (top 10 tung co) cho tab «Tinh lich su» mo phong stop HVN. Chi
      # doc, chi gieo mot lan; sau do bot tu cap nhat top 20 moi luot chay.
      - ../reports/.cache/uni_tf/1h:/seed1h:ro
      # Cac tai lieu da chot, hien o tab «Phương pháp». Chi doc.
      - ../docs:/docs:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

volumes:
  livedata:
    # Ghim TEN THAT cua volume, khong de compose ghep tu ten du an. So lenh
    # that (vi the dang mo tren san) nam trong live2_livedata; doi `name:` o
    # tren hay doi ten thu muc ma khong ghim thi app tro sang mot volume rong,
    # quen het vi the dang mo va co the mo trung lenh.
    name: live2_livedata
